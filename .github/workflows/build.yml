name: Build and Sign APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Zip Files and Rename to APK
      run: |
        sudo apt-get update && sudo apt-get install -y zip
        zip -r rebuilt_unsigned.zip .
        mv rebuilt_unsigned.zip rebuilt_unsigned.apk

    - name: Sign APK with Uber APK Signer
      run: |
        # Download Uber APK Signer
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar
        
        # Sign the APK automatically with proper alignment and signature schemes
        java -jar uber-apk-signer.jar --apks rebuilt_unsigned.apk --out ./final-output
        
        # Rename the output to a clean filename for download
        mv ./final-output/rebuilt_unsigned-aligned-debugSigned.apk final_signed_app.apk

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: final-signed-app
        path: final_signed_app.apk
