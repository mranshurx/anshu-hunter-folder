name: Build and Sign APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip wget rsync

    - name: Package App Files Cleanly
      run: |
        # Create a clean folder for the app contents only
        mkdir app_payload
        
        # Copy everything except git, workflows, and caches to avoid bloat
        rsync -av --exclude='.git' --exclude='.github' --exclude='uber-apk-signer.jar' ./ app_payload/
        
        # Zip the payload and rename extension to .apk
        cd app_payload
        zip -r ../rebuilt_unsigned.zip .
        cd ..
        mv rebuilt_unsigned.zip rebuilt_unsigned.apk

    - name: Download Uber APK Signer
      run: |
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Sign and Align APK
      run: |
        java -jar uber-apk-signer.jar --apks rebuilt_unsigned.apk --out ./final-output

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: final-installable-apk
        path: ./final-output/rebuilt_unsigned-aligned-debugSigned.apk
