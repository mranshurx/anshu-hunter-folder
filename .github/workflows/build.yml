name: Build and Sign APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Apktool
      run: |
        sudo apt update
        sudo apt install -y apktool

    - name: Rebuild APK with Apktool
      run: |
        apktool b . -o rebuilt_unsigned.apk

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore debug.jks -keyalg RSA -keysize 2048 -validity 10000 -alias debugalias -storepass password123 -keypass password123
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.jks rebuilt_unsigned.apk debugalias -storepass password123

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: final-signed-apk
        path: rebuilt_unsigned.apk
