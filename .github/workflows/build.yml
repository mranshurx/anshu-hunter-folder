name: Build and Sign Correct Size APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip wget

    - name: Package Only App Files (Excluding .git and Junk)
      run: |
        # Create a clean staging folder
        mkdir app_payload
        
        # Copy only the necessary game contents, safely ignoring .git, workflows, and temp files
        rsync -av --exclude='.git' --exclude='.github' --exclude='uber-apk-signer.jar' ./ app_payload/
        
        # Zip only the clean payload folder and name it as an APK
        cd app_payload
        zip -r ../rebuilt_unsigned.zip .
        cd ..
        mv rebuilt_unsigned.zip rebuilt_unsigned.apk

    - name: Download Uber APK Signer
      run: |
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Sign and Align APK
      run: |
        java -jar uber-apk-signer.jar --apks rebuilt_unsigned.apk --out ./final-output

    - name: Upload Final Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: final-installable-apk
        path: ./final-output/rebuilt_unsigned-aligned-debugSigned.apk
